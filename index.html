<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mj</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mj">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fdfdfd;--me:#6b6b6b;--me-t:#fff;--me-bd:transparent;--me-time:#d4d4d4;
  --ot:#e9e9e9;--ot-t:#1c1c1c;--ot-bd:transparent;--ot-time:#707070;
  --bar:#fff;--bar-b:#e3e3e3;--bar-t:#222;--inp:#f1f1f1;--sel:#2f7cf6;
  --veil:rgba(253,253,253,.58);
  --fs:18px;--r:24px;--bg-img:none;--bg-op:1;
  --accent:#2f7cf6;
  --ff:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414;--me:#5a5a5a;--ot:#2c2c2c;--ot-t:#eee;--ot-time:#999;--bar:#1e1e1e;--bar-b:#333;--bar-t:#eee;--inp:#2a2a2a;
  --veil:rgba(16,16,16,.62)}}
:root[data-theme="dark"]{
  --bg:#141414;--me:#5a5a5a;--ot:#2c2c2c;--ot-t:#eee;--ot-time:#999;--bar:#1e1e1e;--bar-b:#333;--bar-t:#eee;--inp:#2a2a2a;
  --veil:rgba(16,16,16,.62)}
:root[data-theme="light"]{--veil:rgba(253,253,253,.58)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ff);color:var(--bar-t);background:transparent}

/* 背景层 */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:var(--bg)}
#bg::before{content:"";position:absolute;inset:0;
  background-image:var(--bg-img);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:var(--bg-op,1)}
#bg::after{content:"";position:absolute;inset:0;background:var(--veil);opacity:0;transition:opacity .35s ease}
/* 不透明度越高，柔化遮罩越弱；100% 时遮罩为 0，露出原图 */
#bg.has::after{opacity:calc(1 - var(--bg-op,1))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--bar-b);text-align:center;padding:10px 12px;font-size:17px;font-weight:600}
.hb{position:absolute;top:50%;transform:translateY(-50%);padding:5px 11px;font-size:14px;background:none;border:0}
.hb.l{left:10px}.hb.r{right:10px}
.hb.r,.hb.r2{font-size:18px;padding:3px 11px}
.hb.r2{right:52px;line-height:1}
#name{cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .15s}
#name:active{border-bottom-color:var(--bar-b)}
.nameInp{font:inherit;font-size:17px;font-weight:600;text-align:center;width:9em;max-width:55vw;
  border:0;border-bottom:2px solid var(--sel);background:transparent;color:var(--bar-t);outline:none;padding:0 4px}
#reply:disabled{opacity:.35;cursor:default}
.menu{display:none;position:absolute;right:10px;top:calc(100% + 6px);background:var(--bar);border:1px solid var(--bar-b);border-radius:14px;padding:6px;flex-direction:column;gap:2px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.menu.open{display:flex}
.menu button{border:0;text-align:left;border-radius:10px;font-weight:400;white-space:nowrap;background:none;color:var(--bar-t);padding:9px 14px;font-size:15px;cursor:pointer}
.menu button:active{background:var(--inp)}
header small{display:block;font-size:12px;font-weight:400;opacity:.6;margin-top:1px;min-height:1.3em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}

/* 打印专用标题（屏幕上不显示） */
#printHead{display:none;max-width:480px;margin:0 auto;padding:0 14px;text-align:center}
#printHead b{font-size:18px}
#printHead span{display:block;font-size:12px;opacity:.55;margin-top:3px}

#chat{max-width:480px;margin:0 auto;padding:18px 14px 110px;display:flex;flex-direction:column}
.row{display:flex;flex-direction:column;margin-top:3px;animation:pop .18s ease-out}
.row.gap{margin-top:34px}
.row.me{align-items:flex-end}.row.ot{align-items:flex-start}
.bub{display:flex;align-items:flex-end;gap:12px;max-width:86%;padding:11px 18px;font-size:var(--fs);line-height:1.35;border-radius:var(--r)}
.me .bub{background:var(--me);color:var(--me-t);box-shadow:inset 0 0 0 1px var(--me-bd)}
.ot .bub{background:var(--ot);color:var(--ot-t);box-shadow:inset 0 0 0 1px var(--ot-bd)}
/* 磨砂 */
:root[data-me="frost"] .me .bub,
:root[data-ot="frost"] .ot .bub{
  backdrop-filter:blur(16px) saturate(1.6);
  -webkit-backdrop-filter:blur(16px) saturate(1.6)}
/* 透明：加粗描边 */
:root[data-me="clear"] .me .bub{box-shadow:inset 0 0 0 1.5px var(--me-bd)}
:root[data-ot="clear"] .ot .bub{box-shadow:inset 0 0 0 1.5px var(--ot-bd)}
:root[data-me="clear"] .me .tm{color:var(--bar-t);opacity:.5}
:root[data-ot="clear"] .ot .tm{color:var(--bar-t);opacity:.5}

.row.me.cont .bub{border-top-right-radius:6px}
.row.me.next .bub{border-bottom-right-radius:6px}
.row.ot.cont .bub{border-top-left-radius:6px}
.row.ot.next .bub{border-bottom-left-radius:6px}
.txt{white-space:pre-wrap;word-break:break-word}
.tm{font-size:14px;opacity:.85;flex:none;font-variant-numeric:tabular-nums}
.me .tm{color:var(--me-time)}.ot .tm{color:var(--ot-time)}
.typing .bub{padding:15px 18px;gap:5px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ot-time);opacity:.5;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bar);border-top:1px solid var(--bar-b);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar .in{max-width:480px;margin:0 auto;display:flex;gap:8px;align-items:center}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:17px;border:0;background:var(--inp);color:var(--bar-t);border-radius:22px;padding:10px 16px;outline:none}
input[type=text]:focus-visible{box-shadow:0 0 0 2px var(--sel)}
button{font:inherit;font-size:15px;border:1px solid var(--bar-b);background:var(--bar);color:var(--bar-t);border-radius:20px;padding:9px 14px;cursor:pointer;flex:none}
button.send{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* 美化面板 */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fade .2s ease}
.sheet .card{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;background:var(--bar);border-radius:22px 22px 0 0;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .26s cubic-bezier(.2,.85,.25,1)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-hd b{font-size:16px}
.sheet-hd button{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:16px;padding:6px 16px;font-size:14px}
.sheet section{padding:14px 0;border-top:1px solid var(--bar-b)}
.sheet section:first-of-type{border-top:0}
.sheet h4{margin:0 0 10px;font-size:13px;font-weight:600;opacity:.55;letter-spacing:.4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--inp);border:1px solid transparent;border-radius:999px;padding:8px 15px;font-size:14px;color:var(--bar-t)}
.chips button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips button:disabled{opacity:.32;cursor:default}
.chips.gap-top{margin-top:12px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:2px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .15s}
.sw:active{transform:scale(.92)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bar),0 0 0 4px var(--bar-t)}
.sw-auto{background:linear-gradient(135deg,#fff 0 44%,#b9b9b9 44% 56%,#fff 56% 100%)}
.sw-custom{background:conic-gradient(from .25turn,#ff5f6d,#ffc371,#47cf73,#2f7cf6,#7a5af8,#ff5f6d)}
.sw-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.hint{margin:9px 0 0;font-size:12px;line-height:1.5;opacity:.5}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input[type=range]{flex:1;min-width:0;height:22px;-webkit-appearance:none;appearance:none;
  background:transparent;outline:none;padding:0;margin:0}
.slider-row input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--bar-b)}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;
  border-radius:50%;background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.slider-row input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--bar-b)}
.slider-row input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--accent)}
.slider-row input[type=range]:focus-visible{outline:2px solid var(--sel);outline-offset:4px}
#bgOpVal{font-size:13px;opacity:.65;min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.danger{background:transparent;border:1px solid var(--bar-b);border-radius:14px;padding:9px 18px;font-size:14px;color:#e05252}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

/* 轻提示 */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);
  background:rgba(0,0,0,.82);color:#fff;font-size:14px;padding:9px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:30;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 导出 PDF / 打印样式 ============ */
/* 不再强制覆盖气泡配色：用户选的颜色、质感、字体、字号、圆角都原样带进 PDF。
   data-print="full"  完整美化（含背景图、深浅主题）
   data-print="plain" 无背景（白纸，仍保留气泡/字体等美化） */
@media print{
  @page{margin:14mm 12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* 隐藏交互元素 */
  header,#bar,.menu,.sheet,.toast,body::before,.typing{display:none !important}

  /* 打印标题 */
  #printHead{display:block !important;max-width:none;padding:0 0 12px;margin:0 0 18px;border-bottom:1px solid var(--bar-b)}

  /* 聊天区域：块级，分页更自然 */
  #chat{display:block !important;max-width:none;margin:0;padding:0}
  .row{margin-top:4px;animation:none !important;break-inside:avoid;page-break-inside:avoid}
  .row.gap{margin-top:18px}
  .bub{max-width:80%}

  /* 无背景：白纸，深色主题下对方「自动」气泡也改回浅色，文字保持可读 */
  :root[data-print="plain"] #bg{display:none !important}
  :root[data-print="plain"],:root[data-print="plain"] body{background:#fff !important}
  :root[data-print="plain"]{--bar-t:#1c1c1c;--bar-b:#ddd}
  :root[data-print="plain"]:not([data-ot]){--ot:#f0f0f0;--ot-t:#1c1c1c;--ot-time:#707070}
}
</style>
</head>
<body>
<div id="bg"></div>

<header>
  <b id="name" title="点击修改名字">mj</b><small id="st">在线</small>
  <button class="hb r2" id="reply" title="让 mj 回复" aria-label="让 mj 回复">☾</button>
  <button class="hb r" id="star" title="更多" aria-haspopup="true">☆</button>
  <div class="menu" id="menu">
    <button id="openSheet">美化</button>
    <button id="exportPdf">导出 PDF · 完整美化</button>
    <button id="exportPlain">导出 PDF · 无背景</button>
    <button id="clear">清空聊天</button>
  </div>
</header>

<div id="printHead"><b id="pName">mj</b><span id="pMeta"></span></div>

<main id="chat" aria-live="polite"></main>

<div id="bar"><div class="in">
  <input id="msg" type="text" placeholder="发消息给 mj…" autocomplete="off" enterkeyhint="send">
  <button class="send" id="send">发送</button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="美化设置">
  <div class="mask" id="mask"></div>
  <div class="card">
    <div class="sheet-hd"><b>美化</b><button id="done">完成</button></div>

    <section>
      <h4>主题</h4>
      <div class="chips" id="themeChips">
        <button data-v="auto">跟随系统</button>
        <button data-v="light">浅色</button>
        <button data-v="dark">深色</button>
      </div>
    </section>

    <section>
      <h4>背景图</h4>
      <div class="chips">
        <button id="pickBg">选择图片…</button>
        <button id="clearBg">移除背景</button>
      </div>
      <p class="hint">自动压缩并铺满屏幕，会叠一层柔化遮罩保证文字清晰。</p>
    </section>

    <section>
      <h4>背景不透明度</h4>
      <div class="slider-row">
        <input type="range" id="bgOp" min="0" max="100" step="1" value="100" aria-label="背景不透明度">

      <p class="hint">100% 为原图；调低会淡化图片并加深柔化遮罩，保证文字清晰；0% 等于隐藏背景。</p>
    </section>

    <section>
      <h4>我的气泡</h4>
      <div class="swatches" id="meSw"></div>
      <div class="chips gap-top" id="meStyleChips">
        <button data-v="solid">实色</button>
        <button data-v="clear">透明</button>

    <section>
      <h4>对方气泡（mj）</h4>
      <div class="swatches" id="otSw"></div>

        <button data-v="solid">实色</button>
        <button data-v="clear">透明</button>

      </div>
      <p class="hint">选「自动」时跟随深浅主题配色，质感不可调整。</p>
    </section>

    <section>
      <h4>字号</h4>
      <div class="chips" id="sizeChips">
        <button data-v="16">小</button>
        <button data-v="18">标准</button>

      </div>

    <section>

      <div class="chips" id="fontChips">
        <button data-v="sys">系统</button>
        <button data-v="hei">黑体</button>
        <button data-v="song">宋体</button>
        <button data-v="kai">楷体</button>
        <button data-v="round">圆体</button>
        <button data-v="mono">等宽</button>
        <button data-v="hand">手写</button>
        <button data-v="cute">可爱</button>
        <button data-v="brush">行书</button>
        <button data-v="grass">草书</button>
        <button data-v="li">隶书</button>
        <button data-v="wei">魏碑</button>
        <button data-v="ya">雅致</button>
        <button data-v="crayon">蜡笔</button>
        <button data-v="wenkai">文楷</button>
        <button data-v="fang">仿宋</button>
        <button data-v="notoserif">思源宋</button>
        <button data-v="notosans">思源黑</button>
        <button data-v="maocao">毛草</button>
        <button data-v="huangyou">黄油</button>
        <button data-v="typewriter">打字机</button>
        <button data-v="caveat">英文手写</button>
        <button data-v="pacifico">花体</button>
        <button data-v="playfair">英文衬线</button>
      </div>
      <p class="hint">部分字体优先使用系统自带（iOS、macOS 效果最佳），其他设备会自动加载网络字体，离线时回退为系统字体。英文手写／花体／打字机／英文衬线只改英文和数字，中文会用相近的中文字体。</p>
    </section>

    <section>
      <h4>圆角</h4>
      <div class="chips" id="radiusChips">
        <button data-v="26">圆润</button>
        <button data-v="18">适中</button>
        <button data-v="10">方正</button>
      </div>
    </section>

    <section>
      <button class="danger" id="clear2">清空聊天记录</button>
    </section>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
/* ============ 聊天数据 ============ */
var KEY="mj-chat-v1";
var chat=document.getElementById("chat"),msg=document.getElementById("msg"),st=document.getElementById("st");
var replyBtn=document.getElementById("reply");
var nameEl=document.getElementById("name");
var data=load(),busy=false;

function load(){try{var v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){}return[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function now(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}

function bubble(d,i){
  var prev=data[i-1],next=data[i+1];
  var gap=!prev||prev.s!==d.s;
  var row=document.createElement("div");
  row.className="row "+d.s+(gap&&i>0?" gap":"");
  if(prev&&prev.s===d.s)row.className+=" cont";
  if(next&&next.s===d.s)row.className+=" next";
  row.innerHTML='<div class="bub"><span class="txt"></span><span class="tm"></span></div>';
  row.querySelector(".txt").textContent=d.t;
  row.querySelector(".tm").textContent=d.m;
  return row;
}
function render(typing){
  chat.innerHTML="";
  data.forEach(function(d,i){chat.appendChild(bubble(d,i))});
  if(typing){
    var last=data[data.length-1];
    var r=document.createElement("div");
    r.className="row ot typing"+(!last||last.s!=="ot"?" gap":"");
    r.innerHTML='<div class="bub"><i></i><i></i><i></i></div>';
    chat.appendChild(r);
  }
  window.scrollTo(0,document.body.scrollHeight);
}
function send(){
  var t=msg.value.trim();
  if(!t)return;
  msg.value="";
  data.push({s:"me",t:t,m:now()});save();render(busy);msg.focus();
}
function reply(){
  if(busy)return;
  busy=true;replyBtn.disabled=true;render(true);st.textContent="正在输入…";
  setTimeout(function(){
    data.push({s:"ot",t:String(1+Math.floor(Math.random()*6)),m:now()});
    save();busy=false;replyBtn.disabled=false;st.textContent="在线";render(false);
  },500+Math.random()*700);
}
function clearChat(){
  if(confirm("清空聊天记录？")){data=[];save();render(false);}
}

/* ============ 美化设置 ============ */
var PKEY="mj-chat-prefs-v1";

/* 气泡配色预设 */
var PRESETS=[
  {id:"graphite",n:"石墨",  c:"#6b6b6b"},
  {id:"blue",    n:"海蓝",  c:"#2f7cf6"},
  {id:"teal",    n:"青碧",  c:"#0f9d8f"},
  {id:"pink",    n:"樱粉",  c:"#e0658a"},
  {id:"violet",  n:"紫罗兰",c:"#7a5af8"},
  {id:"ink",     n:"墨黑",  c:"#1b1b1b"},
  {id:"white",   n:"白色",  c:"#ffffff"},
  {id:"sand",    n:"暖沙",  c:"#d9b98c"}
];

/* 字体：系统自带优先，网络字体兜底 */

/* 注意：这里只操作内部变量 d，不要引用外部尚未赋值的 prefs */
var prefs=(function(){
  var d={theme:"auto",bg:"",bgOp:100,me:"graphite",meStyle:"solid",ot:"",otStyle:"solid",fs:18,r:26,font:"sys",name:"mj"};
  try{
    var v=localStorage.getItem(PKEY);
    if(v){
      var o=JSON.parse(v);
      for(var k in d){if(o[k]!==undefined)d[k]=o[k];}
    }
  }catch(e){}
  /* 旧数据迁移：原来透明的预设改成「透明质感」 */
  if(d.me==="clear"){d.me="graphite";d.meStyle="clear";}
  if(!d.meStyle)d.meStyle="solid";
  if(d.ot===undefined||d.ot===null)d.ot="";
  if(!d.otStyle)d.otStyle="solid";
  if(typeof d.bgOp!=="number"||!isFinite(d.bgOp))d.bgOp=100;
  return d;
})();

function savePrefs(){
  try{localStorage.setItem(PKEY,JSON.stringify(prefs));return true}
  catch(e){return false}
}

/* ---------- 颜色工具 ---------- */
function hexRgb(h){
  h=String(h||"").replace("#","");
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-fA-F]{6}$/.test(h))return null;
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function hexLight(h){
  var c=hexRgb(h);if(!c)return false;
  return (0.299*c[0]+0.587*c[1]+0.114*c[2])>150;
}
function rgbaStr(h,a){
  var c=hexRgb(h);if(!c)return h;
  return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";
}
function isHex(v){return /^#[0-9a-fA-F]{6}$/.test(v);}
function colorOf(id){
  for(var i=0;i<PRESETS.length;i++)if(PRESETS[i].id===id)return PRESETS[i].c;
  if(isHex(id))return id;
  return PRESETS[0].c;
}

/* 根据颜色 + 质感算出实际样式 */
function paintVars(hex,style){
  if(style==="clear"){
    return {bg:"transparent",t:"var(--bar-t)",bd:"rgba(136,136,136,.45)",accent:"#2f7cf6"};
  }
  var light=hexLight(hex);
  var t=light?"#1c1c1c":"#fff";
  if(style==="frost"){
    return {bg:rgbaStr(hex,.55),t:t,bd:rgbaStr(hex,.42),accent:"#2f7cf6"};
  }
  return {bg:hex,t:t,bd:light?"rgba(0,0,0,.14)":"transparent",accent:light?"#2f7cf6":hex};
}

function applyPrefs(){
  var r=document.documentElement;

  /* 主题 */
  if(prefs.theme==="auto")r.removeAttribute("data-theme");
  else r.setAttribute("data-theme",prefs.theme);

  /* 背景图 */
  if(prefs.bg){
    r.style.setProperty("--bg-img",'url("'+prefs.bg+'")');
    bgEl.classList.add("has");
  }else{
    r.style.removeProperty("--bg-img");
    bgEl.classList.remove("has");
  }

  /* 背景不透明度 */
  var op=Number(prefs.bgOp);
  if(!isFinite(op))op=100;
  op=Math.max(0,Math.min(100,op));
  r.style.setProperty("--bg-op",op/100);

  /* 我的气泡 */
  var mv=paintVars(colorOf(prefs.me),prefs.meStyle);
  r.setAttribute("data-me",prefs.meStyle);
  r.style.setProperty("--me",mv.bg);
  r.style.setProperty("--me-t",mv.t);
  r.style.setProperty("--me-bd",mv.bd);
  r.style.setProperty("--accent",mv.accent);

  /* 对方气泡 */
  if(prefs.ot){
    var ov=paintVars(colorOf(prefs.ot),prefs.otStyle);
    r.setAttribute("data-ot",prefs.otStyle);
    r.style.setProperty("--ot",ov.bg);
    r.style.setProperty("--ot-t",ov.t);
    r.style.setProperty("--ot-bd",ov.bd);
  }else{
    /* 自动：交还给主题 CSS */
    r.removeAttribute("data-ot");
    r.style.removeProperty("--ot");
    r.style.removeProperty("--ot-t");
    r.style.removeProperty("--ot-bd");
  }

  /* 字体 / 字号 / 圆角 */
  var f=FONTS[0];
  for(var i=0;i<FONTS.length;i++){if(FONTS[i].id===prefs.font)f=FONTS[i];}
  r.style.setProperty("--ff",f.v);
  r.style.setProperty("--fs",prefs.fs+"px");
  r.style.setProperty("--r",prefs.r+"px");
}

/* ---------- 色板 ---------- */
function buildPalette(wrap,opts){
  var items=[];

  if(opts.auto){
    var a=document.createElement("button");
    a.type="button";a.className="sw sw-auto";a.dataset.v="";
    a.title="自动";a.setAttribute("aria-label","自动");
    wrap.appendChild(a);items.push(a);
  }

  PRESETS.forEach(function(p){
    var b=document.createElement("button");
    b.type="button";b.className="sw";b.dataset.v=p.id;
    b.title=p.n;b.setAttribute("aria-label",p.n);
    b.style.background=p.c;
    wrap.appendChild(b);items.push(b);
  });

  var c=document.createElement("button");
  c.type="button";c.className="sw sw-custom";c.title="自定义颜色";
  c.setAttribute("aria-label","自定义颜色");
  var inp=document.createElement("input");
  inp.type="color";inp.value="#2f7cf6";
  c.appendChild(inp);
  wrap.appendChild(c);

  wrap.addEventListener("click",function(e){
    var b=e.target.closest(".sw");
    if(!b||b===c)return;
    opts.set(b.dataset.v);
  });
  inp.addEventListener("input",function(){opts.set(inp.value);});

  return {custom:c,inp:inp,items:items};
}

function syncPalette(pal,val){
  if(!pal)return;
  for(var i=0;i<pal.items.length;i++){
    pal.items[i].setAttribute("aria-pressed",String(pal.items[i].dataset.v===val));
  }
  var cus=isHex(val);
  pal.custom.setAttribute("aria-pressed",String(cus));
  if(cus){
    pal.custom.style.background=val;
    pal.inp.value=val;
  }else{
    pal.custom.style.background="conic-gradient(from .25turn,#ff5f6d,#ffc371,#47cf73,#2f7cf6,#7a5af8,#ff5f6d)";
  }
}

function markGroup(id,val){
  var bs=document.querySelectorAll("#"+id+" button[data-v]");
  for(var i=0;i<bs.length;i++){
    bs[i].setAttribute("aria-pressed",String(bs[i].dataset.v===String(val)));
  }
}
function syncUI(){
  markGroup("themeChips",prefs.theme);
  markGroup("sizeChips",prefs.fs);
  markGroup("radiusChips",prefs.r);
  markGroup("fontChips",prefs.font);
  markGroup("meStyleChips",prefs.meStyle);
  markGroup("otStyleChips",prefs.otStyle);
  syncPalette(PAL_ME,prefs.me);
  syncPalette(PAL_OT,prefs.ot);

  /* 同步不透明度滑杆 */
  var opEl=document.getElementById("bgOp"),opVal=document.getElementById("bgOpVal");
  if(opEl){
    opEl.value=prefs.bgOp;
    opVal.textContent=prefs.bgOp+"%";
  }

  /* 自动配色时禁用质感按钮 */
  var bs=document.querySelectorAll("#otStyleChips button[data-v]");
  for(var i=0;i<bs.length;i++){bs[i].disabled=!prefs.ot;}
}

function bindGroup(id,key,cast){

    prefs[key]=cast?cast(b.dataset.v):b.dataset.v;
    savePrefs();applyPrefs();syncUI();
  });
}

/* ============ 点击改名字 ============ */
function applyName(){
  nameEl.textContent=prefs.name;
  msg.placeholder="发消息给 "+prefs.name+"…";
  document.title=prefs.name;
}
nameEl.addEventListener("click",function(){
  if(nameEl._busy)return;
  nameEl._busy=true;

  var inp=document.createElement("input");
  inp.type="text";
  inp.className="nameInp";
  inp.value=prefs.name;
  inp.maxLength=16;
  inp.setAttribute("aria-label","修改名字");
  nameEl.style.display="none";
  nameEl.parentNode.insertBefore(inp,nameEl);
  inp.focus();inp.select();

  var done=false;
  function finish(ok){
    if(done)return;done=true;
    var v=inp.value.trim();
    if(ok&&v)prefs.name=v.slice(0,16);
    savePrefs();
    inp.remove();
    nameEl.style.display="";
    nameEl._busy=false;
    applyName();
  }
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.isComposing){e.preventDefault();finish(true);}
    else if(e.key==="Escape"){finish(false);}
  });
  inp.addEventListener("blur",function(){finish(true);});
});

/* ============ 背景图：压缩后存本地 ============ */
function shrink(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1400;
      var s=Math.min(1,max/Math.max(img.width||1,img.height||1));
      var w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
      var c=document.createElement("canvas");c.width=w;c.height=h;
      var ctx=c.getContext("2d");
      ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      var q=0.8,d=c.toDataURL("image/jpeg",q);
      while(d.length>1500000&&q>0.35){q-=0.12;d=c.toDataURL("image/jpeg",q);}
      cb(d);
    };
    img.onerror=function(){cb(null)};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null)};
  fr.readAsDataURL(file);
}
document.getElementById("pickBg").onclick=function(){fileInput.click()};
fileInput.addEventListener("change",function(){
  var f=fileInput.files&&fileInput.files[0];
  if(!f)return;
  if(!/^image\//.test(f.type)){toast("请选择图片文件");fileInput.value="";return;}
  var old=st.textContent;
  st.textContent="处理中…";
  shrink(f,function(url){
    fileInput.value="";
    st.textContent=old;
    if(!url){toast("图片读取失败");return;}
    prefs.bg=url;
    if(!savePrefs()){
      prefs.bg="";
      toast("图片太大，保存失败");
    }else{
      toast("背景已更换");
    }
    applyPrefs();syncUI();
  });
});

/* 轻提示 */
var toastEl=null;
function toast(t){
  if(!toastEl){toastEl=document.createElement("div");toastEl.className="toast";document.body.appendChild(toastEl);}
  toastEl.textContent=t;toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(function(){toastEl.classList.remove("show")},2000);
}

/* ============ 导出 PDF ============ */
/* 借助浏览器打印：在打印窗口中选择「另存为 PDF」即可。
   full  = 完整美化（背景图、主题、气泡、字体全部保留）
   plain = 无背景（白纸，气泡/字体/字号/圆角仍保留） */
var _printTitle=null,_printMode="full";
var rootEl=document.documentElement;

function ymdNow(){
  var d=new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}

window.addEventListener("beforeprint",function(){
  _printTitle=document.title;
  /* 浏览器会用 document.title 作为 PDF 的默认文件名 */
  document.title=(prefs.name||"mj")+" 聊天记录 "+ymdNow();
  rootEl.setAttribute("data-print",_printMode);
});

window.addEventListener("afterprint",function(){
  if(_printTitle!==null){
    document.title=_printTitle;
    _printTitle=null;
  }
  rootEl.removeAttribute("data-print");
  _printMode="full";
});

function exportPdf(mode){
  _printMode=(mode==="plain")?"plain":"full";
  rootEl.setAttribute("data-print",_printMode);
  var pName=document.getElementById("pName");
  var pMeta=document.getElementById("pMeta");
  if(pName)pName.textContent=(prefs.name||"mj")+" · 聊天记录";
  if(pMeta)pMeta.textContent=ymdNow()+" · 共 "+data.length+" 条消息";

  toast("在打印窗口选择「另存为 PDF」");
  setTimeout(function(){window.print();},420);
}
document.getElementById("exportPdf").onclick=function(){
  menu.classList.remove("open");
  exportPdf("full");
};
document.getElementById("exportPlain").onclick=function(){
  menu.classList.remove("open");
  exportPdf("plain");
};
